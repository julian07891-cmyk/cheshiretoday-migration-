<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="newsletter-facebook-title newsletter-facebook-description">
  <title id="newsletter-facebook-title">Cheshire Today newsletter Facebook template</title><desc id="newsletter-facebook-description">Landscape newsletter-promotion layout with logo, image, category, headline and call-to-action placeholders.</desc>
  <style>.interface{font-family:'Public Sans',Arial,sans-serif}.headline{font-family:'Playfair Display',Georgia,serif}</style>
  <rect width="1200" height="630" fill="#1E3A8A"/>
  <g data-placeholder="logo" class="interface" fill="none" stroke="#F7F4EE" stroke-width="3"><rect x="72" y="72" width="250" height="54" rx="7"/><text x="197" y="107" fill="#F7F4EE" stroke="none" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2">LOGO</text></g>
  <g data-placeholder="category" class="interface"><rect x="868" y="74" width="260" height="50" rx="25" fill="#059669"/><text x="998" y="106" fill="#F7F4EE" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="2">[CATEGORY]</text></g>
  <g data-placeholder="image"><rect x="72" y="168" width="430" height="326" rx="18" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="4"/><path d="M220 282L354 366M354 282L220 366" fill="none" stroke="#E6E1D8" stroke-width="5" stroke-linecap="round"/><text class="interface" x="287" y="450" fill="#475569" text-anchor="middle" font-size="21" font-weight="600" letter-spacing="2">IMAGE</text></g>
  <g data-placeholder="headline" class="headline" fill="#F7F4EE"><text x="560" y="224" font-size="60" font-weight="700">[HEADLINE]</text><path d="M560 268H1128M560 342H1060M560 416H1010" stroke="#E6E1D8" stroke-width="3" opacity="0.75"/></g>
  <g data-placeholder="cta" class="interface"><rect x="560" y="474" width="360" height="72" rx="10" fill="#F7F4EE"/><text x="740" y="520" fill="#1E3A8A" text-anchor="middle" font-size="23" font-weight="700">[CTA]</text></g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="10 8"><rect x="72" y="72" width="1056" height="486"/><path d="M530 72V558M72 144H1128M72 462H1128"/></g>
</svg>
