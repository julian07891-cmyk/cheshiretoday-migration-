<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="poll-facebook-title poll-facebook-description">
  <title id="poll-facebook-title">Cheshire Today audience poll Facebook template</title><desc id="poll-facebook-description">Landscape audience-question layout with core placeholders and two poll-option fields.</desc>
  <style>.interface{font-family:'Public Sans',Arial,sans-serif}.headline{font-family:'Playfair Display',Georgia,serif}</style>
  <rect width="1200" height="630" fill="#F7F4EE"/>
  <g data-placeholder="logo" class="interface" fill="none" stroke="#1E3A8A" stroke-width="3"><rect x="72" y="72" width="250" height="54" rx="7"/><text x="197" y="107" fill="#1E3A8A" stroke="none" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2">LOGO</text></g>
  <g data-placeholder="category" class="interface"><rect x="900" y="74" width="228" height="50" rx="25" fill="#047857"/><text x="1014" y="106" fill="#F7F4EE" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="2">YOUR VIEW</text></g>
  <g data-placeholder="image"><rect x="72" y="166" width="330" height="300" rx="18" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="4"/><path d="M180 270L294 340M294 270L180 340" fill="none" stroke="#E6E1D8" stroke-width="5" stroke-linecap="round"/><text class="interface" x="237" y="430" fill="#475569" text-anchor="middle" font-size="21" font-weight="600" letter-spacing="2">IMAGE</text></g>
  <g data-placeholder="headline" class="headline" fill="#020617"><text x="462" y="218" font-size="54" font-weight="700">[QUESTION]</text><path d="M462 260H1128M462 330H1030" stroke="#E6E1D8" stroke-width="3"/></g>
  <g data-placeholder="poll-options" class="interface"><rect x="462" y="360" width="310" height="70" rx="12" fill="#1E3A8A"/><text x="617" y="404" fill="#F7F4EE" text-anchor="middle" font-size="21" font-weight="700">[OPTION ONE]</text><rect x="796" y="360" width="310" height="70" rx="12" fill="#047857"/><text x="951" y="404" fill="#F7F4EE" text-anchor="middle" font-size="21" font-weight="700">[OPTION TWO]</text></g>
  <g data-placeholder="cta" class="interface"><rect x="462" y="476" width="300" height="70" rx="10" fill="#1E3A8A"/><text x="612" y="521" fill="#F7F4EE" text-anchor="middle" font-size="22" font-weight="700">[CTA]</text></g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="10 8"><rect x="72" y="72" width="1056" height="486"/><path d="M432 72V558M72 144H1128M72 450H1128"/></g>
</svg>
