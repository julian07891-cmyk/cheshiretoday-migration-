<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="property-facebook-title property-facebook-description">
  <title id="property-facebook-title">Cheshire Today property Facebook template</title><desc id="property-facebook-description">Landscape property layout with logo, image, category, headline and call-to-action placeholders.</desc>
  <style>.interface{font-family:'Public Sans',Arial,sans-serif}.headline{font-family:'Playfair Display',Georgia,serif}</style>
  <rect width="1200" height="630" fill="#FBFAF7"/><rect width="420" height="630" fill="#1E3A8A"/>
  <g data-placeholder="logo" data-logo-source="frontend/public/cheshire-today-email-logo.png" data-logo-variant="inverse" class="interface" fill="none" stroke="#F7F4EE" stroke-width="2" stroke-dasharray="6 5"><rect x="72" y="72" width="159.34" height="54"/><text x="247" y="104" fill="#F7F4EE" stroke="none" font-size="15" font-weight="700" letter-spacing="1">[INVERSE LOGO]</text></g>
  <g data-placeholder="category" class="interface"><rect x="72" y="166" width="250" height="50" rx="25" fill="#F7F4EE"/><text x="197" y="198" fill="#1E3A8A" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="2">[CATEGORY]</text></g>
  <g data-placeholder="headline" class="headline" fill="#F7F4EE"><text x="72" y="286" font-size="54" font-weight="700">[HEADLINE]</text><path d="M72 326H348M72 394H328M72 462H300" stroke="#E6E1D8" stroke-width="3"/></g>
  <g data-placeholder="image"><rect x="462" y="72" width="666" height="486" rx="18" fill="#F7F4EE" stroke="#E6E1D8" stroke-width="4"/><path d="M710 250L880 360M880 250L710 360" fill="none" stroke="#E6E1D8" stroke-width="5" stroke-linecap="round"/><text class="interface" x="795" y="500" fill="#475569" text-anchor="middle" font-size="22" font-weight="600" letter-spacing="2">IMAGE</text></g>
  <g data-placeholder="cta" class="interface"><rect x="72" y="486" width="276" height="64" rx="10" fill="#047857"/><text x="210" y="528" fill="#F7F4EE" text-anchor="middle" font-size="22" font-weight="700">[CTA]</text></g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="10 8"><rect x="72" y="72" width="1056" height="486"/><path d="M420 72V558M72 144H1128M72 470H1128"/></g>
</svg>
