<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="event-facebook-title event-facebook-description">
  <title id="event-facebook-title">Cheshire Today event Facebook template</title><desc id="event-facebook-description">Landscape editorial event layout with core placeholders plus date and location fields.</desc>
  <style>.interface{font-family:'Public Sans',Arial,sans-serif}.headline{font-family:'Playfair Display',Georgia,serif}</style>
  <rect width="1200" height="630" fill="#F7F4EE"/><rect width="1200" height="18" fill="#047857"/>
  <g data-placeholder="logo" data-logo-source="frontend/public/cheshire-today-email-logo.png" data-logo-variant="standard" class="interface" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="6 5"><rect x="72" y="72" width="159.34" height="54"/><text x="247" y="104" fill="#1E3A8A" stroke="none" font-size="15" font-weight="700" letter-spacing="1">[STANDARD LOGO]</text></g>
  <g data-placeholder="category" class="interface"><rect x="900" y="74" width="228" height="50" rx="25" fill="#047857"/><text x="1014" y="106" fill="#F7F4EE" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="2">[CATEGORY]</text></g>
  <g data-placeholder="image"><rect x="72" y="158" width="510" height="364" rx="18" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="4"/><path d="M245 286L409 386M409 286L245 386" fill="none" stroke="#E6E1D8" stroke-width="5" stroke-linecap="round"/><text class="interface" x="327" y="474" fill="#475569" text-anchor="middle" font-size="22" font-weight="600" letter-spacing="2">IMAGE</text></g>
  <g data-placeholder="headline" class="headline" fill="#020617"><text x="630" y="208" font-size="54" font-weight="700">[HEADLINE]</text><path d="M630 248H1128M630 316H1060" stroke="#E6E1D8" stroke-width="3"/></g>
  <g data-placeholder="event-date" class="interface"><rect x="630" y="354" width="220" height="62" rx="10" fill="#1E3A8A"/><text x="740" y="394" fill="#F7F4EE" text-anchor="middle" font-size="20" font-weight="700">[DATE]</text></g>
  <g data-placeholder="event-location" class="interface"><rect x="870" y="354" width="258" height="62" rx="10" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="3"/><text x="999" y="394" fill="#1E293B" text-anchor="middle" font-size="20" font-weight="700">[LOCATION]</text></g>
  <g data-placeholder="cta" class="interface"><rect x="630" y="474" width="300" height="72" rx="10" fill="#047857"/><text x="780" y="520" fill="#F7F4EE" text-anchor="middle" font-size="23" font-weight="700">[CTA]</text></g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="10 8"><rect x="72" y="72" width="1056" height="486"/><path d="M600 72V558M72 144H1128M72 450H1128"/></g>
</svg>
