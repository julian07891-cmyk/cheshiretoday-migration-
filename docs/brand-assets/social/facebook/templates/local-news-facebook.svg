<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="local-facebook-title local-facebook-description">
  <title id="local-facebook-title">Cheshire Today local news Facebook template</title><desc id="local-facebook-description">Landscape local-news layout with logo, image, category, headline and call-to-action placeholders.</desc>
  <style>.interface{font-family:'Public Sans',Arial,sans-serif}.headline{font-family:'Playfair Display',Georgia,serif}</style>
  <rect width="1200" height="630" fill="#F7F4EE"/><rect width="24" height="630" fill="#1E3A8A"/>
  <g data-placeholder="logo" class="interface" fill="none" stroke="#1E3A8A" stroke-width="3"><rect x="72" y="72" width="250" height="54" rx="7"/><text x="197" y="107" fill="#1E3A8A" stroke="none" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2">LOGO</text></g>
  <g data-placeholder="category" class="interface"><rect x="900" y="74" width="228" height="50" rx="25" fill="#1E3A8A"/><text x="1014" y="106" fill="#F7F4EE" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="2">[CATEGORY]</text></g>
  <g data-placeholder="image"><rect x="72" y="158" width="560" height="364" rx="18" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="4"/><path d="M270 286L434 386M434 286L270 386" fill="none" stroke="#E6E1D8" stroke-width="5" stroke-linecap="round"/><text class="interface" x="352" y="474" fill="#475569" text-anchor="middle" font-size="22" font-weight="600" letter-spacing="2">IMAGE</text></g>
  <g data-placeholder="headline" class="headline" fill="#020617"><text x="680" y="220" font-size="58" font-weight="700">[HEADLINE]</text><path d="M680 260H1128M680 330H1060M680 400H1000" stroke="#E6E1D8" stroke-width="3"/></g>
  <g data-placeholder="cta" class="interface"><rect x="680" y="474" width="300" height="72" rx="10" fill="#1E3A8A"/><text x="830" y="520" fill="#F7F4EE" text-anchor="middle" font-size="23" font-weight="700">[CTA]</text></g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="10 8"><rect x="72" y="72" width="1056" height="486"/><path d="M600 72V558M72 144H1128M72 462H1128"/></g>
</svg>
