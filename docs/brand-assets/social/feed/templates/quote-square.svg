<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="quote-square-title quote-square-description">
  <title id="quote-square-title">Cheshire Today quote square feed template</title>
  <desc id="quote-square-description">Reusable editorial quote layout with logo, image, category, headline and call-to-action placeholders.</desc>
  <style>.interface{font-family:'Public Sans',Arial,sans-serif}.headline{font-family:'Playfair Display',Georgia,serif}</style>
  <rect width="1080" height="1080" fill="#F7F4EE"/>
  <g data-placeholder="logo" class="interface" fill="none" stroke="#1E3A8A" stroke-width="3"><rect x="72" y="84" width="230" height="60" rx="8"/><text x="187" y="123" fill="#1E3A8A" stroke="none" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2">LOGO</text></g>
  <g data-placeholder="category" class="interface"><rect x="748" y="84" width="260" height="60" rx="30" fill="#047857"/><text x="878" y="123" fill="#F7F4EE" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2">[CATEGORY]</text></g>
  <g data-placeholder="image"><circle cx="180" cy="290" r="95" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="4"/><path d="M130 250L230 330M230 250L130 330" fill="none" stroke="#E6E1D8" stroke-width="5" stroke-linecap="round"/><text class="interface" x="180" y="405" fill="#475569" text-anchor="middle" font-size="18" font-weight="600">IMAGE</text></g>
  <text class="headline" x="72" y="575" fill="#1E3A8A" font-size="190" font-weight="700">“</text>
  <g data-placeholder="headline" class="headline" fill="#020617"><text x="180" y="510" font-size="66" font-weight="700">[HEADLINE]</text><path d="M180 555H1008M180 635H920M180 715H820" stroke="#E6E1D8" stroke-width="3"/></g>
  <g data-placeholder="cta" class="interface"><rect x="72" y="928" width="320" height="80" rx="10" fill="#1E3A8A"/><text x="232" y="977" fill="#F7F4EE" text-anchor="middle" font-size="22" font-weight="700">[CTA]</text></g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="10 8"><rect x="72" y="72" width="936" height="936"/><path d="M306 72V1008M540 72V1008M774 72V1008M72 160H1008M72 450H1008M72 900H1008"/></g>
</svg>
