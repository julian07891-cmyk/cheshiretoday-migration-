<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="breaking-square-title breaking-square-description">
  <title id="breaking-square-title">Cheshire Today breaking news square feed template</title>
  <desc id="breaking-square-description">Reusable breaking-news feed layout with logo, image, category, headline and call-to-action placeholders.</desc>
  <style>.interface{font-family:'Public Sans',Arial,sans-serif}.headline{font-family:'Playfair Display',Georgia,serif}</style>
  <rect width="1080" height="1080" fill="#F7F4EE"/>
  <rect width="1080" height="270" fill="#DC2626"/>
  <g data-placeholder="logo" class="interface" fill="none" stroke="#F7F4EE" stroke-width="3"><rect x="72" y="84" width="230" height="60" rx="8"/><text x="187" y="123" fill="#F7F4EE" stroke="none" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2">LOGO</text></g>
  <g data-placeholder="category" class="interface"><rect x="770" y="84" width="238" height="60" rx="30" fill="#F7F4EE"/><text x="889" y="123" fill="#DC2626" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2">BREAKING</text></g>
  <g data-placeholder="image"><rect x="72" y="300" width="936" height="390" rx="18" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="4"/><path d="M430 440L650 555M650 440L430 555" fill="none" stroke="#E6E1D8" stroke-width="6" stroke-linecap="round"/><text class="interface" x="540" y="635" fill="#475569" text-anchor="middle" font-size="23" font-weight="600" letter-spacing="2">IMAGE</text></g>
  <g data-placeholder="headline" class="headline" fill="#020617"><text x="72" y="790" font-size="70" font-weight="700">[HEADLINE]</text><path d="M72 832H1008M72 910H790" stroke="#E6E1D8" stroke-width="3"/></g>
  <g data-placeholder="cta" class="interface"><rect x="72" y="944" width="300" height="64" rx="10" fill="#DC2626"/><text x="222" y="985" fill="#F7F4EE" text-anchor="middle" font-size="22" font-weight="700">[CTA]</text></g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="10 8"><rect x="72" y="72" width="936" height="936"/><path d="M306 72V1008M540 72V1008M774 72V1008M72 270H1008M72 720H1008M72 928H1008"/></g>
</svg>
