<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="business-square-title business-square-description">
  <title id="business-square-title">Cheshire Today business square feed template</title>
  <desc id="business-square-description">Reusable business feed layout with logo, image, category, headline and call-to-action placeholders.</desc>
  <style>.interface{font-family:'Public Sans',Arial,sans-serif}.headline{font-family:'Playfair Display',Georgia,serif}</style>
  <rect width="1080" height="1080" fill="#F7F4EE"/>
  <rect width="1080" height="20" fill="#047857"/>
  <g data-placeholder="logo" class="interface" fill="none" stroke="#1E3A8A" stroke-width="3"><rect x="72" y="84" width="230" height="60" rx="8"/><text x="187" y="123" fill="#1E3A8A" stroke="none" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2">LOGO</text></g>
  <g data-placeholder="category" class="interface"><rect x="748" y="84" width="260" height="60" rx="30" fill="#047857"/><text x="878" y="123" fill="#F7F4EE" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2">[CATEGORY]</text></g>
  <g data-placeholder="image"><rect x="72" y="190" width="936" height="430" rx="20" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="4"/><path d="M430 330L650 450M650 330L430 450" fill="none" stroke="#E6E1D8" stroke-width="6" stroke-linecap="round"/><text class="interface" x="540" y="555" fill="#475569" text-anchor="middle" font-size="23" font-weight="600" letter-spacing="2">IMAGE</text></g>
  <rect x="72" y="680" width="12" height="198" rx="6" fill="#047857"/>
  <g data-placeholder="headline" class="headline" fill="#020617"><text x="116" y="750" font-size="68" font-weight="700">[HEADLINE]</text><path d="M116 792H1008M116 868H820" stroke="#E6E1D8" stroke-width="3"/></g>
  <g data-placeholder="cta" class="interface"><rect x="72" y="928" width="320" height="80" rx="10" fill="#047857"/><text x="232" y="977" fill="#F7F4EE" text-anchor="middle" font-size="22" font-weight="700">[CTA]</text></g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="10 8"><rect x="72" y="72" width="936" height="936"/><path d="M306 72V1008M540 72V1008M774 72V1008M72 160H1008M72 650H1008M72 910H1008"/></g>
</svg>
