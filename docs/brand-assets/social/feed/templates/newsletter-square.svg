<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="newsletter-square-title newsletter-square-description">
  <title id="newsletter-square-title">Cheshire Today newsletter square feed template</title>
  <desc id="newsletter-square-description">Reusable newsletter-promotion layout with logo, image, category, headline and call-to-action placeholders.</desc>
  <style>.interface{font-family:'Public Sans',Arial,sans-serif}.headline{font-family:'Playfair Display',Georgia,serif}</style>
  <rect width="1080" height="1080" fill="#1E3A8A"/>
  <g data-placeholder="logo" class="interface" fill="none" stroke="#F7F4EE" stroke-width="3"><rect x="405" y="84" width="270" height="60" rx="8"/><text x="540" y="123" fill="#F7F4EE" stroke="none" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2">LOGO</text></g>
  <g data-placeholder="category" class="interface"><rect x="390" y="190" width="300" height="60" rx="30" fill="#059669"/><text x="540" y="229" fill="#F7F4EE" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2">[CATEGORY]</text></g>
  <g data-placeholder="headline" class="headline" fill="#F7F4EE" text-anchor="middle"><text x="540" y="365" font-size="74" font-weight="700">[HEADLINE]</text><path d="M210 410H870M270 485H810" stroke="#E6E1D8" stroke-width="3" opacity="0.7"/></g>
  <g data-placeholder="image"><rect x="250" y="545" width="580" height="240" rx="18" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="4"/><path d="M455 620L625 705M625 620L455 705" fill="none" stroke="#E6E1D8" stroke-width="5" stroke-linecap="round"/><text class="interface" x="540" y="750" fill="#475569" text-anchor="middle" font-size="21" font-weight="600">IMAGE</text></g>
  <g data-placeholder="cta" class="interface"><rect x="310" y="890" width="460" height="92" rx="12" fill="#F7F4EE"/><text x="540" y="947" fill="#1E3A8A" text-anchor="middle" font-size="26" font-weight="700">[CTA]</text></g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="10 8"><rect x="72" y="72" width="936" height="936"/><path d="M306 72V1008M540 72V1008M774 72V1008M72 160H1008M72 520H1008M72 860H1008"/></g>
</svg>
