<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="poll-square-title poll-square-description">
  <title id="poll-square-title">Cheshire Today poll square feed template</title>
  <desc id="poll-square-description">Reusable audience-poll layout with logo, image, category, headline, response and call-to-action placeholders.</desc>
  <style>.interface{font-family:'Public Sans',Arial,sans-serif}.headline{font-family:'Playfair Display',Georgia,serif}</style>
  <rect width="1080" height="1080" fill="#F7F4EE"/>
  <g data-placeholder="logo" class="interface" fill="none" stroke="#1E3A8A" stroke-width="3"><rect x="72" y="84" width="230" height="60" rx="8"/><text x="187" y="123" fill="#1E3A8A" stroke="none" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2">LOGO</text></g>
  <g data-placeholder="category" class="interface"><rect x="748" y="84" width="260" height="60" rx="30" fill="#047857"/><text x="878" y="123" fill="#F7F4EE" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="2">[CATEGORY]</text></g>
  <g data-placeholder="image"><rect x="72" y="180" width="936" height="280" rx="18" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="4"/><path d="M455 265L625 355M625 265L455 355" fill="none" stroke="#E6E1D8" stroke-width="5" stroke-linecap="round"/><text class="interface" x="540" y="420" fill="#475569" text-anchor="middle" font-size="21" font-weight="600">IMAGE</text></g>
  <g data-placeholder="headline" class="headline" fill="#020617" text-anchor="middle"><text x="540" y="565" font-size="62" font-weight="700">[HEADLINE]</text><path d="M160 608H920" stroke="#E6E1D8" stroke-width="3"/></g>
  <g data-placeholder="poll-options" class="interface"><rect x="150" y="665" width="780" height="74" rx="37" fill="#FBFAF7" stroke="#1E3A8A" stroke-width="4"/><text x="540" y="712" fill="#1E3A8A" text-anchor="middle" font-size="23" font-weight="700">[OPTION]</text><rect x="150" y="765" width="780" height="74" rx="37" fill="#FBFAF7" stroke="#1E3A8A" stroke-width="4"/><text x="540" y="812" fill="#1E3A8A" text-anchor="middle" font-size="23" font-weight="700">[OPTION]</text></g>
  <g data-placeholder="cta" class="interface"><text x="540" y="970" fill="#475569" text-anchor="middle" font-size="22" font-weight="600">[CTA]</text></g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="10 8"><rect x="72" y="72" width="936" height="936"/><path d="M306 72V1008M540 72V1008M774 72V1008M72 160H1008M72 490H1008M72 630H1008M72 880H1008"/></g>
</svg>
