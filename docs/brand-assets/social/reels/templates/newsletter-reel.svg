<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="newsletter-reel-title newsletter-reel-description">
  <title id="newsletter-reel-title">Cheshire Today newsletter Reel cover template</title>
  <desc id="newsletter-reel-description">Reusable newsletter Reel cover with six editable placeholders inside the shared safe area.</desc>
  <style>.interface { font-family: 'Public Sans', Arial, sans-serif; } .headline { font-family: 'Playfair Display', Georgia, serif; }</style>
  <rect width="1080" height="1920" fill="#1E3A8A"/>
  <g data-placeholder="logo" class="interface" fill="none" stroke="#F7F4EE" stroke-width="3"><rect x="405" y="270" width="270" height="72" rx="8"/><text x="540" y="316" fill="#F7F4EE" stroke="none" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="2">LOGO</text></g>
  <g data-placeholder="category" class="interface"><rect x="390" y="390" width="300" height="62" rx="31" fill="#059669"/><text x="540" y="430" fill="#F7F4EE" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2">[CATEGORY]</text></g>
  <g data-placeholder="headline" class="headline" fill="#F7F4EE" text-anchor="middle"><text x="540" y="610" font-size="90" font-weight="700">[HEADLINE]</text><path d="M190 660H890M250 765H830" stroke="#E6E1D8" stroke-width="3" opacity="0.75"/></g>
  <g data-placeholder="image"><rect x="190" y="830" width="700" height="430" rx="22" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="4"/><path d="M430 985L650 1110M650 985L430 1110" fill="none" stroke="#E6E1D8" stroke-width="6" stroke-linecap="round"/><text class="interface" x="540" y="1190" fill="#475569" text-anchor="middle" font-size="26" font-weight="600" letter-spacing="2">IMAGE</text></g>
  <g data-placeholder="reel-badge" class="interface"><rect x="690" y="1170" width="170" height="64" rx="32" fill="#047857"/><text x="775" y="1212" fill="#F7F4EE" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="2">[REEL]</text></g>
  <g data-placeholder="cta" class="interface"><rect x="310" y="1430" width="460" height="112" rx="12" fill="#F7F4EE"/><text x="540" y="1501" fill="#1E3A8A" text-anchor="middle" font-size="30" font-weight="700">[CTA]</text></g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="12 10"><rect x="72" y="250" width="936" height="1370"/><path d="M540 250V1620M72 365H1008M72 1390H1008"/></g>
</svg>
