<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="business-reel-title business-reel-description">
  <title id="business-reel-title">Cheshire Today business Reel cover template</title>
  <desc id="business-reel-description">Reusable business Reel cover with six editable placeholders inside the shared safe area.</desc>
  <style>.interface { font-family: 'Public Sans', Arial, sans-serif; } .headline { font-family: 'Playfair Display', Georgia, serif; }</style>
  <rect width="1080" height="1920" fill="#F7F4EE"/><rect width="1080" height="26" fill="#047857"/>
  <g data-placeholder="logo" class="interface" fill="none" stroke="#1E3A8A" stroke-width="3"><rect x="72" y="270" width="270" height="72" rx="8"/><text x="207" y="316" fill="#1E3A8A" stroke="none" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="2">LOGO</text></g>
  <g data-placeholder="category" class="interface"><rect x="748" y="275" width="260" height="62" rx="31" fill="#047857"/><text x="878" y="315" fill="#F7F4EE" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2">[CATEGORY]</text></g>
  <g data-placeholder="image"><rect x="72" y="430" width="936" height="620" rx="22" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="4"/><path d="M420 670L660 810M660 670L420 810" fill="none" stroke="#E6E1D8" stroke-width="6" stroke-linecap="round"/><text class="interface" x="540" y="910" fill="#475569" text-anchor="middle" font-size="26" font-weight="600" letter-spacing="2">IMAGE</text></g>
  <g data-placeholder="reel-badge" class="interface"><rect x="800" y="970" width="180" height="64" rx="32" fill="#1E3A8A"/><text x="890" y="1012" fill="#F7F4EE" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="2">[REEL]</text></g>
  <rect x="72" y="1110" width="14" height="270" rx="7" fill="#047857"/>
  <g data-placeholder="headline" class="headline" fill="#020617"><text x="120" y="1215" font-size="84" font-weight="700">[HEADLINE]</text><path d="M120 1262H1008M120 1365H830" stroke="#E6E1D8" stroke-width="3"/></g>
  <g data-placeholder="cta" class="interface"><rect x="72" y="1480" width="390" height="104" rx="12" fill="#047857"/><text x="267" y="1547" fill="#F7F4EE" text-anchor="middle" font-size="28" font-weight="700">[CTA]</text></g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="12 10"><rect x="72" y="250" width="936" height="1370"/><path d="M540 250V1620M72 390H1008M72 1440H1008"/></g>
</svg>
