<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="breaking-reel-title breaking-reel-description">
  <title id="breaking-reel-title">Cheshire Today breaking news Reel cover template</title>
  <desc id="breaking-reel-description">Reusable breaking-news Reel cover with six editable placeholders inside the shared safe area.</desc>
  <style>.interface { font-family: 'Public Sans', Arial, sans-serif; } .headline { font-family: 'Playfair Display', Georgia, serif; }</style>
  <rect width="1080" height="1920" fill="#F7F4EE"/>
  <rect width="1080" height="440" fill="#DC2626"/>
  <g data-placeholder="logo" class="interface" fill="none" stroke="#F7F4EE" stroke-width="3"><rect x="72" y="270" width="270" height="72" rx="8"/><text x="207" y="316" fill="#F7F4EE" stroke="none" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="2">LOGO</text></g>
  <g data-placeholder="category" class="interface"><rect x="732" y="275" width="276" height="62" rx="31" fill="#F7F4EE"/><text x="870" y="315" fill="#DC2626" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2">[CATEGORY]</text></g>
  <g data-placeholder="image"><rect x="72" y="480" width="936" height="610" rx="22" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="4"/><path d="M420 700L660 840M660 700L420 840" fill="none" stroke="#E6E1D8" stroke-width="6" stroke-linecap="round"/><text class="interface" x="540" y="950" fill="#475569" text-anchor="middle" font-size="26" font-weight="600" letter-spacing="2">IMAGE</text></g>
  <g data-placeholder="reel-badge" class="interface"><rect x="800" y="1000" width="180" height="64" rx="32" fill="#1E3A8A"/><text x="890" y="1042" fill="#F7F4EE" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="2">[REEL]</text></g>
  <g data-placeholder="headline" class="headline" fill="#020617"><text x="72" y="1210" font-size="86" font-weight="700">[HEADLINE]</text><path d="M72 1258H1008M72 1362H825" stroke="#E6E1D8" stroke-width="3"/></g>
  <g data-placeholder="cta" class="interface"><rect x="72" y="1480" width="380" height="104" rx="12" fill="#DC2626"/><text x="262" y="1547" fill="#F7F4EE" text-anchor="middle" font-size="28" font-weight="700">[CTA]</text></g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="12 10"><rect x="72" y="250" width="936" height="1370"/><path d="M540 250V1620M72 440H1008M72 1440H1008"/></g>
</svg>
