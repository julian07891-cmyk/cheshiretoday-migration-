<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="top-story-title top-story-description">
  <title id="top-story-title">Cheshire Today top story Instagram Story template</title>
  <desc id="top-story-description">Reusable lead-story layout with logo, image, category, headline and call-to-action placeholders inside the Story safe area.</desc>
  <style>
    .interface { font-family: 'Public Sans', Arial, sans-serif; }
    .headline { font-family: 'Playfair Display', Georgia, serif; }
  </style>
  <rect width="1080" height="1920" fill="#F7F4EE"/>
  <rect x="0" y="0" width="28" height="1920" fill="#1E3A8A"/>
  <g data-placeholder="logo" class="interface" fill="none" stroke="#1E3A8A" stroke-width="3">
    <rect x="72" y="270" width="270" height="72" rx="8"/>
    <text x="207" y="316" fill="#1E3A8A" stroke="none" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="2">LOGO</text>
  </g>
  <g data-placeholder="category" class="interface">
    <rect x="766" y="275" width="242" height="62" rx="31" fill="#1E3A8A"/>
    <text x="887" y="315" fill="#F7F4EE" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2">[CATEGORY]</text>
  </g>
  <g data-placeholder="image">
    <rect x="72" y="410" width="936" height="690" rx="22" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="4"/>
    <path d="M400 680L680 830M680 680L400 830" fill="none" stroke="#E6E1D8" stroke-width="6" stroke-linecap="round"/>
    <text class="interface" x="540" y="940" fill="#475569" text-anchor="middle" font-size="26" font-weight="600" letter-spacing="2">IMAGE</text>
  </g>
  <g data-placeholder="headline" class="headline" fill="#020617">
    <text x="72" y="1215" font-size="88" font-weight="700">[HEADLINE]</text>
    <path d="M72 1260H1008M72 1360H850" stroke="#E6E1D8" stroke-width="3"/>
  </g>
  <g data-placeholder="cta" class="interface">
    <rect x="72" y="1490" width="360" height="104" rx="12" fill="#1E3A8A"/>
    <text x="252" y="1557" fill="#F7F4EE" text-anchor="middle" font-size="28" font-weight="700">[CTA]</text>
  </g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="12 10">
    <rect x="72" y="250" width="936" height="1370"/>
    <path d="M540 250V1620M72 380H1008M72 1450H1008"/>
  </g>
</svg>
