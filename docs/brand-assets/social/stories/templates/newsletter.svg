<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="newsletter-title newsletter-description">
  <title id="newsletter-title">Cheshire Today newsletter Instagram Story template</title>
  <desc id="newsletter-description">Reusable newsletter-promotion layout with logo, image, category, headline and call-to-action placeholders inside the Story safe area.</desc>
  <style>
    .interface { font-family: 'Public Sans', Arial, sans-serif; }
    .headline { font-family: 'Playfair Display', Georgia, serif; }
  </style>
  <rect width="1080" height="1920" fill="#1E3A8A"/>
  <g data-placeholder="logo" class="interface" fill="none" stroke="#F7F4EE" stroke-width="3">
    <rect x="405" y="270" width="270" height="72" rx="8"/>
    <text x="540" y="316" fill="#F7F4EE" stroke="none" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="2">LOGO</text>
  </g>
  <g data-placeholder="category" class="interface">
    <rect x="390" y="390" width="300" height="62" rx="31" fill="#059669"/>
    <text x="540" y="430" fill="#F7F4EE" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2">[CATEGORY]</text>
  </g>
  <g data-placeholder="headline" class="headline" fill="#F7F4EE" text-anchor="middle">
    <text x="540" y="610" font-size="94" font-weight="700">[HEADLINE]</text>
    <path d="M190 665H890M260 770H820" stroke="#E6E1D8" stroke-width="3" opacity="0.7"/>
  </g>
  <g data-placeholder="image">
    <rect x="190" y="850" width="700" height="410" rx="22" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="4"/>
    <path d="M430 1000L650 1120M650 1000L430 1120" fill="none" stroke="#E6E1D8" stroke-width="6" stroke-linecap="round"/>
    <text class="interface" x="540" y="1200" fill="#475569" text-anchor="middle" font-size="26" font-weight="600" letter-spacing="2">IMAGE</text>
  </g>
  <g data-placeholder="cta" class="interface">
    <rect x="310" y="1430" width="460" height="112" rx="12" fill="#F7F4EE"/>
    <text x="540" y="1501" fill="#1E3A8A" text-anchor="middle" font-size="30" font-weight="700">[CTA]</text>
  </g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="12 10">
    <rect x="72" y="250" width="936" height="1370"/>
    <path d="M540 250V1620M72 365H1008M72 1390H1008"/>
  </g>
</svg>
