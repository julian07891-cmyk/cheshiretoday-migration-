<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="ai-tech-title ai-tech-description">
  <title id="ai-tech-title">Cheshire Today AI and Tech Instagram Story template</title>
  <desc id="ai-tech-description">Reusable AI and technology layout with logo, image, category, headline and call-to-action placeholders inside the Story safe area.</desc>
  <style>
    .interface { font-family: 'Public Sans', Arial, sans-serif; }
    .headline { font-family: 'Playfair Display', Georgia, serif; }
  </style>
  <rect width="1080" height="1920" fill="#1E3A8A"/>
  <g data-placeholder="logo" class="interface" fill="none" stroke="#F7F4EE" stroke-width="3">
    <rect x="72" y="270" width="270" height="72" rx="8"/>
    <text x="207" y="316" fill="#F7F4EE" stroke="none" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="2">LOGO</text>
  </g>
  <g data-placeholder="category" class="interface">
    <rect x="748" y="275" width="260" height="62" rx="31" fill="#059669"/>
    <text x="878" y="315" fill="#F7F4EE" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2">[CATEGORY]</text>
  </g>
  <g data-placeholder="image">
    <rect x="72" y="420" width="936" height="610" rx="20" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="4"/>
    <path d="M420 670L660 805M660 670L420 805" fill="none" stroke="#E6E1D8" stroke-width="6" stroke-linecap="round"/>
    <text class="interface" x="540" y="900" fill="#475569" text-anchor="middle" font-size="26" font-weight="600" letter-spacing="2">IMAGE</text>
  </g>
  <g data-placeholder="headline" class="headline" fill="#F7F4EE">
    <text x="72" y="1170" font-size="84" font-weight="700">[HEADLINE]</text>
    <path d="M72 1218H1008M72 1318H835" stroke="#E6E1D8" stroke-width="3" opacity="0.7"/>
  </g>
  <g data-placeholder="cta" class="interface">
    <rect x="72" y="1480" width="390" height="104" rx="12" fill="#F7F4EE"/>
    <text x="267" y="1547" fill="#1E3A8A" text-anchor="middle" font-size="28" font-weight="700">[CTA]</text>
  </g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="12 10">
    <rect x="72" y="250" width="936" height="1370"/>
    <path d="M540 250V1620M72 390H1008M72 1440H1008"/>
  </g>
</svg>
