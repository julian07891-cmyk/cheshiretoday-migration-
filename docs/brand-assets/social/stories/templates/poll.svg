<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="poll-title poll-description">
  <title id="poll-title">Cheshire Today poll Instagram Story template</title>
  <desc id="poll-description">Reusable audience-poll layout with logo, image, category, headline, poll-option and call-to-action placeholders inside the Story safe area.</desc>
  <style>
    .interface { font-family: 'Public Sans', Arial, sans-serif; }
    .headline { font-family: 'Playfair Display', Georgia, serif; }
  </style>
  <rect width="1080" height="1920" fill="#F7F4EE"/>
  <g data-placeholder="logo" class="interface" fill="none" stroke="#1E3A8A" stroke-width="3">
    <rect x="72" y="270" width="270" height="72" rx="8"/>
    <text x="207" y="316" fill="#1E3A8A" stroke="none" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="2">LOGO</text>
  </g>
  <g data-placeholder="category" class="interface">
    <rect x="748" y="275" width="260" height="62" rx="31" fill="#047857"/>
    <text x="878" y="315" fill="#F7F4EE" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="2">[CATEGORY]</text>
  </g>
  <g data-placeholder="image">
    <rect x="72" y="405" width="936" height="440" rx="20" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="4"/>
    <path d="M440 560L640 675M640 560L440 675" fill="none" stroke="#E6E1D8" stroke-width="6" stroke-linecap="round"/>
    <text class="interface" x="540" y="780" fill="#475569" text-anchor="middle" font-size="26" font-weight="600" letter-spacing="2">IMAGE</text>
  </g>
  <g data-placeholder="headline" class="headline" fill="#020617" text-anchor="middle">
    <text x="540" y="1000" font-size="76" font-weight="700">[HEADLINE]</text>
    <path d="M170 1050H910M240 1140H840" stroke="#E6E1D8" stroke-width="3"/>
  </g>
  <g data-placeholder="poll-options" class="interface">
    <rect x="170" y="1215" width="740" height="100" rx="50" fill="#FBFAF7" stroke="#1E3A8A" stroke-width="4"/>
    <text x="540" y="1278" fill="#1E3A8A" text-anchor="middle" font-size="28" font-weight="700">[OPTION]</text>
    <rect x="170" y="1345" width="740" height="100" rx="50" fill="#FBFAF7" stroke="#1E3A8A" stroke-width="4"/>
    <text x="540" y="1408" fill="#1E3A8A" text-anchor="middle" font-size="28" font-weight="700">[OPTION]</text>
  </g>
  <g data-placeholder="cta" class="interface">
    <text x="540" y="1555" fill="#475569" text-anchor="middle" font-size="26" font-weight="600">[CTA]</text>
  </g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="12 10">
    <rect x="72" y="250" width="936" height="1370"/>
    <path d="M540 250V1620M72 375H1008M72 1175H1008"/>
  </g>
</svg>
