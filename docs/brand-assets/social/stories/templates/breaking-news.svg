<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="breaking-news-title breaking-news-description">
  <title id="breaking-news-title">Cheshire Today breaking news Instagram Story template</title>
  <desc id="breaking-news-description">Reusable breaking-news layout with logo, image, category, headline and call-to-action placeholders inside the Story safe area.</desc>
  <style>
    .interface { font-family: 'Public Sans', Arial, sans-serif; }
    .headline { font-family: 'Playfair Display', Georgia, serif; }
  </style>
  <rect width="1080" height="1920" fill="#F7F4EE"/>
  <rect width="1080" height="430" fill="#DC2626"/>
  <g data-placeholder="logo" class="interface" fill="none" stroke="#F7F4EE" stroke-width="3">
    <rect x="72" y="270" width="270" height="72" rx="8"/>
    <text x="207" y="316" fill="#F7F4EE" stroke="none" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="2">LOGO</text>
  </g>
  <g data-placeholder="category" class="interface">
    <rect x="764" y="270" width="244" height="72" rx="36" fill="#F7F4EE"/>
    <text x="886" y="316" fill="#DC2626" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="2">BREAKING</text>
  </g>
  <g data-placeholder="image">
    <rect x="72" y="480" width="936" height="570" rx="20" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="4"/>
    <path d="M430 700L650 830M650 700L430 830" fill="none" stroke="#E6E1D8" stroke-width="6" stroke-linecap="round"/>
    <text class="interface" x="540" y="900" fill="#475569" text-anchor="middle" font-size="26" font-weight="600" letter-spacing="2">IMAGE</text>
  </g>
  <g data-placeholder="headline" class="headline" fill="#020617">
    <text x="72" y="1165" font-size="86" font-weight="700">[HEADLINE]</text>
    <path d="M72 1210H1008" stroke="#E6E1D8" stroke-width="3"/>
    <path d="M72 1310H820" stroke="#E6E1D8" stroke-width="3"/>
  </g>
  <g data-placeholder="cta" class="interface">
    <rect x="72" y="1470" width="360" height="104" rx="12" fill="#DC2626"/>
    <text x="252" y="1537" fill="#F7F4EE" text-anchor="middle" font-size="28" font-weight="700">[CTA]</text>
  </g>
  <g id="editor-guides" data-export="hide" display="none" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="12 10">
    <rect x="72" y="250" width="936" height="1370"/>
    <path d="M540 250V1620M72 430H1008M72 1450H1008"/>
  </g>
</svg>
