services:
  - type: web
    name: cheshiretoday
    env: python
    plan: free
    buildCommand: |
      ./render_build.sh

    startCommand: |
      cd backend
      uvicorn server:app --host 0.0.0.0 --port $PORT

  - type: cron
    name: cheshiretoday-backend-warmup
    schedule: "*/10 * * * *"
    command: curl -fsS https://cheshiretoday-migration.onrender.com/api/health
