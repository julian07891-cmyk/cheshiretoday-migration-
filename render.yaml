services:
  - type: web
    name: cheshiretoday
    env: python
    plan: free
    buildCommand: |
      cd frontend
      yarn install
      yarn build
      cd ..
      rm -rf backend/frontend_build
      mkdir -p backend/frontend_build
      cp -R frontend/build/. backend/frontend_build/
    startCommand: |
      cd backend
      uvicorn server:app --host 0.0.0.0 --port $PORT

  - type: cron
    name: cheshiretoday-backend-warmup
    schedule: "*/10 * * * *"
    command: curl -fsS https://cheshiretoday-migration.onrender.com/health
