<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#1E3A8A" />
        <meta name="description" content="Cheshire Today - Your trusted source for local Cheshire news, UK updates, tech, finance, and more. Powered by AI for accurate, timely reporting." />
        <meta name="keywords" content="Cheshire news, Chester news, Warrington, Wirral, Crewe, UK news, local news, tech news, finance news" />
        
        <!-- Critical CSS - Inline for faster FCP -->
        <style>
          *{box-sizing:border-box;margin:0;padding:0}
          html{-webkit-text-size-adjust:100%;line-height:1.5}
          body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#f9fafb;min-height:100vh}
          .dark body{background:#111827}
          #root{min-height:100vh}
          .loading-skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
          @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
          .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
        </style>
        
        <!-- Dark Mode Detection - Add class to html for Tailwind -->
        <script>
          (function() {
            try {
              var d = document.documentElement;
              var t = localStorage.getItem('theme');
              if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                d.classList.add('dark');
              }
            } catch(e) {}
          })();
        </script>
        
        <!-- Preconnect to critical origins for faster loading -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://images.unsplash.com" />
        
        <!-- DNS Prefetch for third-party resources -->
        <link rel="dns-prefetch" href="https://www.google-analytics.com" />
        <link rel="dns-prefetch" href="https://ws-eu.amazon-adsystem.com" />
        
        <!-- Preload critical fonts with font-display swap -->
        <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
        <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>

        <!-- Pre-rendering hint for search engines -->
        <meta name="fragment" content="!" />

        <meta property="og:url" content="https://cheshiretoday.co.uk/" />

        <meta property="og:image:secure_url" content="https://cheshiretoday.co.uk/social-share.jpg" />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Cheshire Today News" />
        <meta property="og:site_name" content="Cheshire Today" />
        <meta property="og:locale" content="en_GB" />

        <meta name="twitter:url" content="https://cheshiretoday.co.uk/" />
        <meta name="twitter:title" content="Cheshire Today - Local News & Updates" />

        <meta name="twitter:image:alt" content="Cheshire Today News" />
        <meta name="twitter:site" content="@CheshireToday" />

        {
          "@context": "https://schema.org",
          "@type": "NewsMediaOrganization",
          "name": "Cheshire Today",
          "url": "https://cheshiretoday.co.uk",
          "logo": {
            "@type": "ImageObject",

          "foundingDate": "2026",
          "description": "Your trusted source for local Cheshire news, UK updates, tech, finance, and more.",
          "areaServed": {
            "@type": "Place",
            "name": "Cheshire, United Kingdom"
          }
        }
        </script>

          .skeleton{background:linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 50%,#e5e7eb 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}

          .hero-placeholder{width:100%;padding-bottom:41.67%;background:#1f2937;border-radius:0.5rem}

          .header-skeleton{height:64px;background:#1e3a8a}

          @font-face{font-family:'Inter';font-display:swap;src:local('Inter')}

        <script src="https://assets.emergent.sh/scripts/emergent-main.js" defer></script>
